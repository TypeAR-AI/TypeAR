<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Doom — TypeAR</title>
<style>:root {
  --bg: #fbfbf9;
  --fg: #16161a;
  --muted: #6b6b73;
  --line: #e4e4de;
  --accent: #1a53ff;
  --code-bg: #f1f1ec;
  --font-sans: ui-sans-serif, -apple-system, "Segoe UI", Inter, Helvetica, Arial, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0d0d0f;
    --fg: #ececec;
    --muted: #8d8d96;
    --line: #23232a;
    --accent: #7f9bff;
    --code-bg: #17171b;
  }
}

* { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-sans);
  font-size: 16px;
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
}

a { color: inherit; text-decoration: none; }
a:hover { color: var(--accent); }

.shell {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  min-height: 100dvh;
  max-width: 720px;
  margin: 0 auto;
  padding: 0 24px;
}

/* Pushes the footer to the bottom of the viewport on short pages. */
.shell > main {
  flex: 1;
}

.site-header {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 16px;
  padding: 40px 0 0;
  flex-wrap: wrap;
}

.brand {
  font-family: var(--font-mono);
  font-size: 18px;
  letter-spacing: -0.02em;
}

.nav {
  display: flex;
  gap: 20px;
  font-size: 14px;
  color: var(--muted);
}

.hero {
  padding: 96px 0 64px;
}

.hero h1 {
  font-family: var(--font-mono);
  font-size: clamp(21px, 4.2vw, 27px);
  line-height: 1.3;
  letter-spacing: -0.03em;
  margin: 0 0 20px;
}

.hero p {
  font-size: clamp(17px, 3.5vw, 20px);
  color: var(--muted);
  margin: 0 0 12px;
  max-width: 34em;
}

.hero .lede {
  color: var(--fg);
}

.actions {
  display: flex;
  gap: 18px;
  flex-wrap: wrap;
  margin-top: 32px;
  font-size: 14px;
  font-family: var(--font-mono);
}

.actions a {
  border-bottom: 1px solid var(--line);
  padding-bottom: 2px;
}

.section {
  border-top: 1px solid var(--line);
  padding: 40px 0;
}

.section h2 {
  font-family: var(--font-mono);
  font-size: 13px;
  font-weight: 500;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
  margin: 0 0 24px;
}

.post-list { list-style: none; margin: 0; padding: 0; }

.post-list li { padding: 14px 0; border-bottom: 1px solid var(--line); }
.post-list li:last-child { border-bottom: none; }

.post-list .title { font-size: 17px; }
.post-list .meta {
  font-family: var(--font-mono);
  font-size: 13px;
  color: var(--muted);
  margin-top: 4px;
}

.post-header { padding: 72px 0 8px; }
.post-header h1 {
  font-size: clamp(26px, 5vw, 34px);
  line-height: 1.2;
  letter-spacing: -0.02em;
  margin: 0 0 12px;
}
.post-header .meta {
  font-family: var(--font-mono);
  font-size: 13px;
  color: var(--muted);
}

.prose { padding: 24px 0 8px; }
.prose h2 { font-size: 20px; margin: 40px 0 12px; letter-spacing: -0.01em; }
.prose h3 { font-size: 17px; margin: 28px 0 8px; }
.prose p, .prose li { color: var(--fg); }
.prose a { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }
.prose code {
  font-family: var(--font-mono);
  font-size: 0.88em;
  background: var(--code-bg);
  padding: 2px 5px;
  border-radius: 4px;
}
.prose .code-card { margin: 24px 0; }
.prose pre code { background: none; padding: 0; font-size: inherit; }
.prose blockquote {
  margin: 24px 0;
  padding-left: 16px;
  border-left: 2px solid var(--line);
  color: var(--muted);
}
.prose img { max-width: 100%; height: auto; }
.prose table { width: 100%; border-collapse: collapse; font-size: 14px; }
.prose th, .prose td { border-bottom: 1px solid var(--line); padding: 8px 10px; text-align: left; }

.site-footer {
  border-top: 1px solid var(--line);
  margin-top: 80px;
  padding: 24px 0 48px;
  font-family: var(--font-mono);
  font-size: 13px;
  color: var(--muted);
  display: flex;
  gap: 20px;
  flex-wrap: wrap;
}

.back {
  font-family: var(--font-mono);
  font-size: 13px;
  color: var(--muted);
}

.empty { color: var(--muted); font-size: 15px; }




.code-card {
  margin: 0;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--code-bg);
  overflow: hidden;
}

.code-card-label {
  display: block;
  padding: 10px 16px;
  border-bottom: 1px solid var(--line);
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
}

.code-card-body {
  overflow-x: auto;
}

.code-card-body pre {
  margin: 0;
  padding: 18px 16px;
  background: transparent !important;
  font-family: var(--font-mono);
  font-size: 13px;
  line-height: 1.65;
  tab-size: 4;
}

.code-card-result {
  display: flex;
  align-items: baseline;
  gap: 10px;
  border-top: 1px solid var(--line);
  padding-left: 16px;
}

.code-card-result .code-card-body { flex: 1; min-width: 0; }
.code-card-result pre { padding-left: 0; }

.code-card-arrow {
  font-family: var(--font-mono);
  font-size: 13px;
  line-height: 1.65;
  padding-top: 18px;
  color: var(--muted);
}

.shiki,
.shiki span {
  color: var(--shiki-light);
  background: transparent !important;
}

@media (prefers-color-scheme: dark) {
  .shiki,
  .shiki span {
    color: var(--shiki-dark);
  }
}

.prose .diagram {
  margin: 34px 0;
  padding: 0;
}

.diagram svg {
  display: block;
  width: 100%;
  height: auto;
  overflow: visible;
}

.diagram figcaption {
  margin-top: 12px;
  font-family: var(--font-mono);
  font-size: 12px;
  line-height: 1.5;
  color: var(--muted);
}

.diagram text {
  font-family: var(--font-mono);
  font-size: 12px;
}

.d-tick { font-size: 10px; }
.d-label { fill: var(--muted); }
.d-strong { fill: var(--fg); }
.d-on { fill: var(--accent); }

.d-box rect {
  fill: var(--code-bg);
  stroke: var(--line);
  stroke-width: 1;
}

.d-box-on rect { stroke: var(--accent); }

.d-bar rect {
  fill: var(--muted);
  opacity: 0.45;
}

.d-bar-cache rect {
  fill: var(--muted);
  opacity: 0.26;
}

.d-bar-on rect { fill: var(--accent); }

.d-axis {
  fill: none;
  stroke: var(--line);
  stroke-width: 1;
}

.d-arrow {
  fill: none;
  stroke: var(--muted);
  stroke-width: 1.5;
}

.d-arrow-head { fill: var(--muted); }

.claim-list {
  list-style: none;
  margin: 28px 0 0;
  padding: 0;
}

.claim-list li {
  position: relative;
  padding: 0 0 12px 24px;
  font-size: 15px;
}

.claim-list li:last-child { padding-bottom: 0; }

.claim-list li::before {
  content: "—";
  position: absolute;
  left: 0;
  color: var(--accent);
  font-family: var(--font-mono);
}

.claim-list .claim-new {
  color: var(--accent);
}

.d-fork {
  fill: none;
  stroke: var(--line);
  stroke-width: 1.5;
}

.form {
  display: flex;
  flex-direction: column;
  gap: 20px;
  max-width: 34em;
}

.form-row {
  display: flex;
  flex-direction: column;
  gap: 7px;
}

.form-row span {
  font-family: var(--font-mono);
  font-size: 12px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--muted);
}

.form input,
.form textarea {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--code-bg);
  color: var(--fg);
  font-family: inherit;
  font-size: 15px;
  line-height: 1.5;
  resize: vertical;
}

.form input:focus,
.form textarea:focus {
  outline: none;
  border-color: var(--accent);
}

.form-trap {
  position: absolute;
  left: -9999px;
  opacity: 0;
  height: 0;
  pointer-events: none;
}

.form-actions {
  display: flex;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
}

.form button {
  padding: 9px 22px;
  border: 1px solid var(--fg);
  border-radius: 999px;
  background: var(--fg);
  color: var(--bg);
  font-family: var(--font-mono);
  font-size: 13px;
  cursor: pointer;
}

.form button:hover:not(:disabled) {
  background: var(--accent);
  border-color: var(--accent);
}

.form button:disabled {
  opacity: 0.55;
  cursor: default;
}

.form-error,
.form-done {
  font-size: 14px;
  color: var(--muted);
}

.form-error { color: var(--accent); }

.hero p a {
  text-decoration: underline;
  text-underline-offset: 3px;
  text-decoration-thickness: 1px;
}

/* Growing-prompt animation: a 12s loop of prompt 1 -> one token -> prompt 2 */
.a-code {
  font-family: var(--font-mono);
  font-size: 11px;
  fill: var(--fg);
}

.a-dim { fill: var(--muted); }
.a-on { fill: var(--accent); }

.a-label {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  fill: var(--muted);
}

@keyframes a-enter {
  0%, 30% { opacity: 0; }
  34%, 100% { opacity: 1; }
}

@keyframes a-enter-late {
  0%, 41% { opacity: 0; }
  45%, 100% { opacity: 1; }
}

@keyframes a-enter-last {
  0%, 63% { opacity: 0; }
  67%, 100% { opacity: 1; }
}

@keyframes a-leave {
  0%, 30% { opacity: 1; }
  34%, 100% { opacity: 0; }
}

@keyframes a-window {
  0%, 30% { opacity: 0; }
  34%, 60% { opacity: 1; }
  64%, 100% { opacity: 0; }
}

@keyframes a-blink {
  0%, 49% { fill-opacity: 1; }
  50%, 100% { fill-opacity: 0; }
}

.a-step1 { animation: a-leave 12s steps(1, end) infinite; }
.a-step2 { animation: a-enter 12s steps(1, end) infinite; }
.a-step2-late { animation: a-enter-late 12s steps(1, end) infinite; }
.a-step3 { animation: a-enter-last 12s steps(1, end) infinite; }
.a-flash { animation: a-window 12s steps(1, end) infinite; }
.a-caret { animation: a-blink 1s steps(1, end) infinite; }

@media (prefers-reduced-motion: reduce) {
  .a-step1,
  .a-step2,
  .a-step2-late,
  .a-step3,
  .a-flash,
  .a-caret {
    animation: none;
  }
  .a-step1,
  .a-flash { display: none; }
}

/* Step timing shared by the two execution-mode diagrams (same 8s cycle) */
@keyframes a-in-20 {
  0%, 16% { opacity: 0; }
  20%, 100% { opacity: 1; }
}

@keyframes a-in-40 {
  0%, 36% { opacity: 0; }
  40%, 100% { opacity: 1; }
}

@keyframes a-in-60 {
  0%, 56% { opacity: 0; }
  60%, 100% { opacity: 1; }
}

.a-t1 { animation: a-in-20 8s steps(1, end) infinite; }
.a-t2 { animation: a-in-40 8s steps(1, end) infinite; }
.a-t3 { animation: a-in-60 8s steps(1, end) infinite; }

@media (prefers-reduced-motion: reduce) {
  .a-t1,
  .a-t2,
  .a-t3 {
    animation: none;
  }
}

.brand-type {
  display: inline-flex;
  align-items: baseline;
  gap: 0.172em;
  font-weight: 600;
}

/* Sized to the cap height so it matches the mark in the favicon, and sitting
   on the baseline because an empty inline-block aligns by its bottom edge. */
.brand-caret {
  display: inline-block;
  width: 0.345em;
  height: 0.731em;
  background: var(--accent);
  animation: brand-blink 1.1s steps(1, end) infinite;
}

@keyframes brand-blink {
  0%, 55% { opacity: 1; }
  56%, 100% { opacity: 0; }
}

@media (prefers-reduced-motion: reduce) {
  .brand-caret { animation: none; }
}

.shell { max-width: 1040px; }
.hero { padding: 64px 0 36px; }
.hero h1 { margin-bottom: 12px; }
.hero p { font-size: 17px; }
.demo-meta { display:flex; flex-wrap:wrap; gap:16px; margin-top:24px; font-family:var(--font-mono); font-size:12px; color:var(--muted); }
#mode { color:var(--accent); }
.grid { display:grid; grid-template-columns:minmax(0, 2fr) minmax(220px, 1fr); gap:28px; align-items:start; }
.screen { border:1px solid var(--line); border-radius:10px; overflow:hidden; background:var(--code-bg); }
.screen img { display:block; width:100%; aspect-ratio:4/3; object-fit:contain; background:#16161a; }
.screen-label { display:flex; justify-content:space-between; padding:10px 16px; font-family:var(--font-mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }
.controls { display:flex; align-items:center; gap:16px; margin-top:18px; }
.controls button { padding:9px 22px; border:1px solid var(--fg); border-radius:999px; background:var(--fg); color:var(--bg); font-family:var(--font-mono); font-size:13px; cursor:pointer; min-width:90px; }
.controls button:hover { background:var(--accent); border-color:var(--accent); }
.controls input { min-width:0; flex:1; accent-color:var(--accent); }
#position { font-family:var(--font-mono); font-size:12px; color:var(--muted); white-space:nowrap; }
#action { color:var(--accent); }
dl { margin:24px 0 0; }
.metric { display:flex; justify-content:space-between; gap:12px; padding:13px 0; border-bottom:1px solid var(--line); font-size:13px; }
dt { color:var(--muted); }
dd { margin:0; font-family:var(--font-mono); text-align:right; }
#note { color:var(--muted); font-size:12px; line-height:1.7; margin:24px 0 0; max-width:650px; }
:focus-visible { outline:2px solid var(--accent); outline-offset:4px; }
@media(max-width:700px) { .grid { grid-template-columns:1fr; } .hero { padding-top:48px; } .site-header { padding-top:28px; } .controls { gap:10px; } .nav { gap:14px; } }
</style></head><body>
<div class="shell">
<header class="site-header">
<div class="brand"><a href="https://typear.ai/" aria-label="TypeAR home"><span class="brand-type">TypeAR<i class="brand-caret" aria-hidden="true"></i></span></a></div>
<nav class="nav" aria-label="Main navigation"><a href="https://typear.ai/blog">blog</a><a href="https://github.com/TypeAR-AI/TypeAR">github</a><a href="https://typear.ai/contact">contact</a></nav>
</header>
<main>
<section class="hero"><h1>Type-Safe Actions for Doom</h1><p>See the game. Choose an action. Make the next move.</p><div class="demo-meta"><span id="mode"></span><span id="scenario"></span></div></section>
<section class="section" aria-label="Doom replay"><h2>Screenshot → decision → action</h2>
<div class="grid"><div><div class="screen"><div class="screen-label"><span>Game view</span><span>ViZDoom</span></div><img id="frame" alt="Doom screenshot before the displayed action"></div>
<div class="controls"><button id="play">Play</button><input aria-label="Replay position" id="seek" type="range" min="0" value="0"><span id="position"></span></div></div>
<aside><div class="code-card"><span class="code-card-label">TypeAR output</span><div class="code-card-body"><pre id="action"></pre></div></div>
<dl><div class="metric"><dt>Decision latency</dt><dd id="latency"></dd></div><div class="metric"><dt>Episode / step</dt><dd id="step"></dd></div><div class="metric"><dt>Reward after action</dt><dd id="reward"></dd></div></dl></aside></div>
<p id="note"></p></section></main>
<footer class="site-footer"><span>© 2026 TypeAR</span><span>Doom demo</span></footer>
</div>
<script>
const data=/*DATA*/null;
const $=id=>document.getElementById(id);let index=0,timer=null;
$('mode').textContent=data.summary.controller;$('scenario').textContent=data.summary.scenario+' / seed '+data.summary.seed;
$('note').textContent=data.summary.timing+(data.summary.error?' Error: '+data.summary.error:'');
$('seek').max=Math.max(0,data.records.length-1);
function draw(){const r=data.records[index];if(!r){$('note').textContent+=' No frames recorded.';return}$('frame').src='data:image/png;base64,'+r.image;$('action').textContent=JSON.stringify(r.action,null,2);$('latency').textContent=r.latency_ms===null?'— preview':r.latency_ms.toFixed(0)+' ms';$('step').textContent=r.episode+' / '+r.step;$('reward').textContent=r.total_reward.toFixed(1);$('seek').value=index;$('position').textContent=(index+1)+' / '+data.records.length}
function stop(){clearInterval(timer);timer=null;$('play').textContent='Play'}
$('play').onclick=()=>{if(timer){stop();return}if(!data.records.length)return;$('play').textContent='Pause';timer=setInterval(()=>{index++;if(index>=data.records.length){index=data.records.length-1;stop()}draw()},160)};
$('seek').oninput=e=>{index=Number(e.target.value);draw()};draw();
</script></body></html>
