name: Create GitHub Release v0.1.3

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/release-v0.1.3.yml]

permissions:
  contents: write

concurrency:
  group: github-release-v0.1.3
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Publish release for the existing tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view v0.1.3 >/dev/null 2>&1; then
            echo "Release v0.1.3 already exists."
            exit 0
          fi
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          TypeLLM 0.1.3 adds dependency-aware execution and broader model protocol support.

          - Declare field dependencies with `depends_on` to run a dependency graph, preserve branch isolation, and reuse parent prompt prefixes.
          - Default `execution="auto"` batches independent fields and follows dependencies when declared; sequential execution remains available.
          - Support up to 24 enum candidates.
          - Add MiniCPM5 and Ling/Ring protocol adapters, including native turn terminators and model-specific thinking behavior.
          - Recover nonempty reasoning that ends at a recognized native EOS/turn terminator by closing the thinking block before typed decoding.
          - Update documentation and retain CPU/GPU evaluation reports. Gemma is not supported in this release.

          Validation: 87 local tests passed; wheel and source distribution checks passed; PyPI installation and dependency-schema smoke checks passed. The new premature-EOS recovery has local regression coverage but has not been rerun on GPU.

          Install or upgrade (Python 3.10+):

          ```bash
          pip install -U typellm
          ```

          [PyPI 0.1.3](https://pypi.org/project/typellm/0.1.3/)
          NOTES
          gh release create v0.1.3 --verify-tag --title "TypeLLM v0.1.3" --notes-file "$RUNNER_TEMP/release-notes.md"
